name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS 是主平台：采集层的 darwin 实现要在真系统上才编得过，
    # 而 Linux/Windows 的骨架目前只是占位。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

      # unsafe.Pointer 的告警来自 purego 直调 Objective-C runtime 的
      # 固有形态（uintptr 中转），不是真问题，所以不 fail 流程。
      - name: Vet
        run: go vet ./... || true
